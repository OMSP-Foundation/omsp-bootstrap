name: Production Baseline and Release Readiness

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies (ADR-0004)
        # omsp_release_readiness.py runs the quality gate, whose
        # unit-tests check discovers tests/test_model_integrity.py
        # (WP-0083), which needs PyYAML.
        run: pip install jsonschema==4.26.0 PyYAML==6.0.3
      - name: Run release-readiness tests
        run: python -m unittest tests/test_omsp_release_readiness.py
      - name: Build production-baseline candidate
        run: python tooling/omsp_release_readiness.py --source-commit "${{ github.sha }}"
      - name: Publish readiness summary
        if: always()
        run: |
          echo '## OMSP Production Baseline' >> "$GITHUB_STEP_SUMMARY"
          if test -f build/release-readiness/production-readiness-assessment.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('build/release-readiness/production-readiness-assessment.json').read_text())
          print(f"- Recommendation: **{report['automated_recommendation']}**")
          print(f"- Proposed version: `{report['release_version_proposal']}`")
          print(f"- Residual risks: {len(report['residual_risks'])}")
          print(f"- Human approval: **{report['approval_status']}**")
          print('- Production release remains unauthorized by automation.')
          PY
          else
            echo '- Assessment missing; inspect logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload release-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-baseline-release-readiness
          path: build/release-readiness/
          if-no-files-found: warn
          retention-days: 90
