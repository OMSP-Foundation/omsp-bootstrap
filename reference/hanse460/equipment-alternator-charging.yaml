  charge-path-topology:
    value: >-
      alternator output to the engine busbar; service-bank charging via
      the 70 mm2 charge wire between engine and service busbars through
      charge relay engine (20F1, 125 A) and the battery combiner (10K1)
      - path marked "not applicable with Li-Ion batterys"; with the
      Li-Ion option, charging runs instead through Mac Plus 12/12-50
      DC-DC chargers and Charge Mate Pro (sheets 20, 21)
    provenance:
      source_id: source:manufacturer:owner-held:h20b-7215-100-010-03:2026-07-16
      authority_class: sourced-manufacturer
      confidence: medium
      retrieval_date: "2026-07-16"
      applicability: >-
        Hanse 460 series circuit diagram
        document:hanseyachts:h20b-7215-100-010:03 (rev. 03); series
        drawing, design family only, no hull applicability; which charge
        path is active depends on the fitted battery variant, which is
        not confirmed as-built (issue #260). Extraction: sheet 10
        (battery combiner box "not applicable with Li-Ion batterys"),
        sheet 20 (engine busbars, 20F1 charge relay engine 125A, charge
        wire), sheet 21 (Mac+, charge mate pro).
