name: Epic
description: Umbrella issue grouping multiple Work Packages toward one outcome
title: "EPIC: "
labels: ["type:epic", "needs-triage"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: The single user/domain outcome this epic delivers when done.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope (In / Out)
      placeholder: |
        In:
        - ...
        Out:
        - ...
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Child Work Packages
      description: Tasklist of WPs under this epic (add as they are created).
      placeholder: |
        - [ ] WP-XXXX ...
        - [ ] WP-XXXX ...
    validations:
      required: false
  - type: dropdown
    id: release
    attributes:
      label: Release Target
      description: Milestone this epic aims at (also set the issue milestone).
      options:
        - v0.5.1
        - v0.6.0
        - v0.7.0
        - v0.8.0
        - v0.9.0
        - v1.0.0
        - Not yet scheduled
    validations:
      required: true
