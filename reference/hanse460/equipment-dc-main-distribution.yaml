        Hanse 460 US-market standard specification valid from 2021.11.12;
        design family only, no hull applicability. Extraction: PDF page 3,
        EQUIPMENT section, wording "12 V and 230 V electric system with
        main panels".
  bus-topology:
    value: >-
      service busbar fed by the service battery bank; fused main paths
      off the busbar: service main 250 A with main switch (10F7/10S1),
      dc distribution aft 300 A with main switch (10F9/10S2), powerboard
      permanent 100 A (10F5), charge relay service 125 A (10F4), solar
      charger 80 A (10F6); the powerboard carries fuse boards X8/X9/X12
      for high-power and relay-switched consumers; the DC panel carries
      the switched consumer circuits (interior lighting, refrigeration,
      navigation electronics, pumps, navigation lights, maneuvering,
      bathing platform) on SIMARINE SPU 303 units (parts 1-3) with a
      SIMARINE SCP 220 H monitoring unit (part 4)
    provenance:
      source_id: source:manufacturer:owner-held:h20b-7215-100-010-03:2026-07-16
      authority_class: sourced-manufacturer
      confidence: medium
      retrieval_date: "2026-07-16"
      applicability: >-
        Hanse 460 series circuit diagram
        document:hanseyachts:h20b-7215-100-010:03 (rev. 03); series
        drawing, design family only, no hull applicability. Extraction:
        sheet 10 (busbar and fuse/main-switch designators), sheets 12-15
        (powerboard parts 1-4), sheets 16-19 (DC panel parts 1-4).
        Summary of the drawn topology, not a verbatim single-sheet
        quotation; circuit list corroborated by the owner's manual
        document:hanseyachts:owners-manual-460-en:v11 Chapter 2
        section 1.5.1 (printed pp. 61-62, PDF pp. 71-72).
  dc-panel-unit-identity:
    value: >-
      DC panel parts 1-3: SIMARINE SPU 303; DC panel part 4: SIMARINE
      SCP 220 H (tank/battery monitoring inputs)
    provenance:
      source_id: source:manufacturer:owner-held:h20b-7215-100-010-03:2026-07-16
      authority_class: sourced-manufacturer
      confidence: high
      retrieval_date: "2026-07-16"
      applicability: >-
        Hanse 460 series circuit diagram
        document:hanseyachts:h20b-7215-100-010:03 (rev. 03); series
        drawing, design family only, no hull applicability; as-built
        panel fitment unconfirmed (issue #260). Extraction: sheets 16-18
