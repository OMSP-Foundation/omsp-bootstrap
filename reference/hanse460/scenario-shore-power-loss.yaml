  - equipment:configuration:vessel-design:hanse:460:reference-0.1.0:dc-consumer-bilge-pump
  - equipment:configuration:vessel-design:hanse:460:reference-0.1.0:dc-consumer-freshwater-pump
  - equipment:configuration:vessel-design:hanse:460:reference-0.1.0:protection-dc-main
  - equipment:configuration:vessel-design:hanse:460:reference-0.1.0:measurement-service-battery
source_manuals:
  - document:hanseyachts:h20b-7215-100-010:03
  - document:hanseyachts:owners-manual-460-en:v11
  - document:mastervolt:chargemaster-plus-manual-10000016594:03
  - document:victron:isolation-transformer-7000w-manual:03
  - document:whisperpower:wp-gi-3600-manual:undated
unacceptable_outcomes:
  - >-
    Any work on a live AC system, any opened switchboard or charger
    enclosure, or any shore-cable handling outside the
    owner's-manual order.
  - >-
    Any protection or galvanic-isolation device bypassed, defeated or
    re-energized without understanding why it opened.
  - >-
    Swimming near the vessel while the AC system is energized.
  - >-
    Continued discharge until essential consumers (navigation lights,
    bilge pump) become unavailable without a recorded human decision.
  - >-
    An unknown value (installed charger model, isolation-device
    identity, display variant) silently treated as a known or safe
    value.
  - >-
    Software or this scenario acting as command authority for any
    decision.
stop_abort_conditions:
  - >-
    Abort immediately on any sign of electrical hazard (heat, smell,
    smoke, discolored insulation, wet connectors) at the inlet,
    breaker box, isolation device or charger; do not continue
    inspection and do not reconnect.
  - >-
    Stop if the shore-feed protection (2F1) has tripped and the
    reason is unknown; re-energizing is treated as unsafe and the
    situation routes to qualified service.
  - >-
    Stop if charger and shunt indications conflict and the conflict
    cannot be resolved by observation; do not proceed on unresolved
    conflict.
  - >-
    Stop at any step whose required evidence is blocked by an
    as-built unknown (installed charger model, isolation-device
    identity — issue #260); never substitute a guessed value.
  - >-
    Hand over to scenario:hanse:460:service-battery-critical-voltage:0.1.0
    when its trigger condition is observed; the handover is recorded.
conservative_human_review_branch: >-
  Unknown or conflicting evidence at any step routes to the
  accountable human skipper for conservative review (consulting the
  marina operator, qualified service or shore support as the skipper
  decides); the scenario never resolves such a conflict
  automatically, and values blocked pending as-built confirmation
  (installed charger model, isolation-device identity, display
  variant — issue #260) remain unknowns until closed through the
  source register, never through in-scenario assumption.
assumptions:
  - >-
    The standard reference configuration applies: the shore 1 feed is
    the standard drawing path; shore 2 and AC-generator paths are
    provisioned options (series circuit diagram sheet 2) and are not
    assumed present.
  - >-
    Affected-set derivation rule (graph-derived, not hand-listed):
    related_equipment and the connections cited in causes[] are the
    equipment reachable from shore-power-inlet via connection
    instances in supply direction, plus the protection role
    protecting a derived element and the measurement role measuring a
    derived element; reproducible command in README.md section 9
    (seed shore-power-inlet: 10 equipment, 7 connections).
  - >-
    Shared cause taxonomy: the family-level entry
    cause:hanse:460:service-battery-critical-voltage:charge-path-shore-failure
    is reused by identity from the WP-0085 scenario (identical id,
    description and implicates; scenario-local evidence_requirement);
    the scenario-specific causes refine it without re-describing it
    (README.md section 9, shared-taxonomy note).
unknowns:
  - >-
    Installed charger model within the documented family, installed
    display variant and the installed galvanic-isolation device
    identity (galvanic isolator alone vs. Victron or WhisperPower
    isolation transformer) are unconfirmed as-built (issue #260); all
    family-level citations are marked as such.
  - >-
    The shore-side installation (pedestal, shore-side protection,
    connecting-power limitation) is outside the model boundary and
    described by no captured document.
  - >-
    Shore-connector standard and inlet position on deck are not
    stated by any captured source (equipment-shore-power-inlet
    unknowns).
  - >-
    No captured document prescribes a monitoring interval or log
    format for the loss condition; the recording rule is defined by
    this scenario.
exclusions:
  - >-
    Shore 2 and AC-generator option paths (provisioned option paths
    of the series drawing, not realized in the standard reference
    configuration) and all shore-side infrastructure beyond the
    inlet.
  - >-
    Inverter role and AC consumers: the standard reference
    configuration realizes no inverter connection instance (option
    XH2201; README section 4), so the graph derivation excludes the
    inverter; AC-side consumers are outside the golden-path slice
    (golden path section 5.2).
  - >-
    Alternator role and engine charging path: mechanically excluded
    by the seed derivation (unaffected by a shore-supply loss);
    engine-driven charging enters only as a skipper decision in
    step 6, handled by the critical-voltage scenario.
  - >-
    Any repair, reset or reconfiguration procedure: this scenario is
    inspection/observation reference only.
