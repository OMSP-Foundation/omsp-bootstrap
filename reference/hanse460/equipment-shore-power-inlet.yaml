schema_version: "0.2.0"
id: equipment:configuration:vessel-design:hanse:460:reference-0.1.0:shore-power-inlet
concept: OMSP-CONCEPT-EQUIPMENT-ROLE
belongs_to: system:vessel-design:hanse:460:electrical
name: Shore power inlet
role: >-
  Shore power inlet and AC supply path of the golden-path slice: accepts
  the 230 V shore supply and feeds the battery charger. AC distribution
  beyond the shore-inlet-to-charger (and inverter output role) path is
  out of scope per golden path section 5.2.
quantity:
  status: unknown
  note: Number of shore-power inlets is not stated by any captured source.
ports:
  - id: port:equipment:configuration:vessel-design:hanse:460:reference-0.1.0:shore-power-inlet:shore-supply-in
    concept: OMSP-CONCEPT-PORT
    name: Shore supply input
    description: External 230 V shore-supply entry point of the inlet role.
  - id: port:equipment:configuration:vessel-design:hanse:460:reference-0.1.0:shore-power-inlet:ac-out
    concept: OMSP-CONCEPT-PORT
    name: AC output
    description: Onboard AC supply path toward the battery charger.
attributes:
  nominal-supply-voltage:
    value: 230
    unit: V
    provenance:
      source_id: source:secondary:newwaveyachts:hanse-460-spec-pricelist-2021-11-12:2026-07-15
      authority_class: sourced-secondary
      confidence: medium
      retrieval_date: "2026-07-15"
      applicability: >-
        Hanse 460 US-market standard specification valid from 2021.11.12;
        design family only, no hull applicability. Extraction: PDF page 3,
        EQUIPMENT section, wording "230 V shore power".
  inlet-protection-rating:
    value: >-
      shore inlet marked 230 V / 32 A; protected by a combined
      RCD/breaker "FI/LS 32A" (2F1) in the breaker box, with a 32 A
      galvanic isolator in the shore-1 feed; the owner's manual states
      the shore connection is fuse-protected with a GFCI device
    provenance:
      source_id: source:manufacturer:owner-held:h20b-7215-100-010-03:2026-07-16
      authority_class: sourced-manufacturer
      confidence: high
      retrieval_date: "2026-07-16"
      applicability: >-
        Hanse 460 series circuit diagram
        document:hanseyachts:h20b-7215-100-010:03 (rev. 03); series
        drawing, design family only, no hull applicability. Extraction:
        sheet 2 — inlet "shore 1 230V 32A", breaker box "2F1 FI/LS 32A",
        isolator symbol "32A shore 1". Corroborated by owner's manual
        document:hanseyachts:owners-manual-460-en:v11 Chapter 2 section
        1.5.2 "Shore connection", printed page 66 (PDF page 76), and
        device list item 34 "galvanic isolator", printed page 60
        (PDF page 70).
  provisioned-circuits:
    value: >-
      shore 1 feed (standard drawing path, inlet 230 V / 32 A, breaker
      box 2F1 FI/LS 32 A, 32 A isolator); shore 2 option path (inlet
      230 V / 32 A, breaker box 2F2 FI/LS 32 A, 32 A isolator); AC
      generator option path (2G1 generator 8000i/10000i with converter,
      breaker box 2F3 LS 32 A); breaker boxes located "technic room
      aft prt"
    provenance:
      source_id: source:manufacturer:owner-held:h20b-7215-100-010-03:2026-07-16
      authority_class: sourced-manufacturer
      confidence: medium
      retrieval_date: "2026-07-16"
      applicability: >-
        Hanse 460 series circuit diagram
        document:hanseyachts:h20b-7215-100-010:03 (rev. 03); series
        drawing, design family only, no hull applicability; which of the
        provisioned paths beyond shore 1 is fitted on any built vessel is
        not confirmed as-built (issue #260). Extraction: sheet 2 (shore 1
        / shore 2 inlets "230V 32A", breaker boxes "2F1 FI/LS 32A",
        "2F2 FI/LS 32A", "2F3 LS 32A", isolator symbols "32A shore 1/2",
        generator "2G1 8000i/10000i", location label "technic room
        aft prt").
  connector-standard:
    status: unknown
    note: >-
      Shore-connector standard is not stated by any captured source;
      the owner's manual describes only a "compatible shore-connecting
      line" without a connector standard.
