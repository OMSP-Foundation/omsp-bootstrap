attributes:
  instrument-type:
    value: >-
      500 A DC shunt in the service-bank negative path ("shunt 500A
      installed"), Masterbus-connected, with a battery temperature
      sensor; battery voltage/shunt inputs terminate on the SIMARINE
      SCP 220 H unit (DC panel part 4, input "battery service") with an
      information display
    provenance:
      source_id: source:manufacturer:owner-held:h20b-7215-100-010-03:2026-07-16
      authority_class: sourced-manufacturer
      confidence: high
      retrieval_date: "2026-07-16"
      applicability: >-
        Hanse 460 series circuit diagram
        document:hanseyachts:h20b-7215-100-010:03 (rev. 03); series
        drawing, design family only, no hull applicability. Extraction:
        sheet 10 ("shunt 500A installed", masterbus shunt), sheet 11
        (temperature sensor shunt), sheet 19 (DC Panel Part 4 SIMARINE
        SCP 220 H, "battery service" input, "Information Display"),
        sheet 54 (masterbus overview: shunt, display). The installed
        display variant (Simarine PICO vs. PICOone) and the as-built
        shunt configuration are NOT asserted (issue #260); no value from
        the Simarine Pico manual is transcribed.
  display-location:
    status: unknown
    note: >-
      The as-built display variant and its location are not confirmed
      (Simarine PICO vs. PICOone, source register section 4.4;
      issue #260).
  calibration-state:
