name: Service-battery measurement
role: >-
  Voltage/current measurement role of the golden-path slice (golden path
  section 5.1 "measurement-*": battery monitor / panel meters) observing
  the service battery bank. Measurement points are modeled as points,
  not as a live data pipeline (golden path section 5.2). The series
  measurement arrangement is transcribed from the owner-held circuit
  diagram (WP-0093); the installed display variant remains unconfirmed
  as-built.
