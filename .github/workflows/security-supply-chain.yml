name: Security and Supply Chain Baseline

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run security baseline tests
        run: python -m unittest tests/test_omsp_security_baseline.py
      - name: Generate security and supply-chain report
        run: python tooling/omsp_security_baseline.py --output build/security-supply-chain-report.json
      - name: Generate Python dependency inventory
        run: |
          python - <<'PY'
          import json, platform
          from pathlib import Path
          payload = {
              "format": "OMSP minimal SBOM 0.1",
              "runtime": {"name": "python", "version": platform.python_version()},
              "declared_runtime_dependencies": [],
              "note": "Sprint-5 MVP tooling uses only the Python standard library. GitHub Actions are inventoried in the security report."
          }
          Path("build").mkdir(exist_ok=True)
          Path("build/sbom.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-supply-chain-evidence
          path: build/*.json
