name: Alternator charge feed line (charging source to service bank)
attributes:
  conductor-specification:
    value: >-
      charge wire red/black 70 mm2 between engine busbar and service
      busbar (H20B-7220-800-020 1 "rd 70" / 2 "bk 70"), fused 125 A at
      the engine side (20F1 charge relay engine) and switched by the
      battery combiner (10K1) - AGM path marked "not applicable with
      Li-Ion batterys"; Li-Ion option path via Mac Plus DC-DC chargers:
      16 mm2 (H20B-7220-824-215 "rd 16") and 35/70 mm2
      (H20B-7220-824-216 "rd 35" / "rd 70" / "bk 70")
    provenance:
      source_id: source:manufacturer:owner-held:h20b-7215-100-010-03:2026-07-16
      authority_class: sourced-manufacturer
      confidence: high
      retrieval_date: "2026-07-16"
      applicability: >-
        Hanse 460 series circuit diagram
        document:hanseyachts:h20b-7215-100-010:03 (rev. 03); series
        drawing, design family only, no hull applicability; the active
        path depends on the fitted battery variant, which is not
        confirmed as-built (issue #260). Extraction: sheet 10 (battery
        combiner box, ve+ charge wire "rd 70"), sheet 20 (20F1 "charge
        relay engine 125A", charge-wire designators), sheet 21 (Mac+ /
        Charge Mate Pro wires). Conductor lengths and physical routing
        are on the wiring-harness drawings and are not transcribed here.
