attributes:
  rated-charge-current:
    value: 35
    unit: A
    provenance:
      source_id: source:secondary:newwaveyachts:hanse-460-spec-pricelist-2021-11-12:2026-07-15
      authority_class: sourced-secondary
      confidence: medium
      retrieval_date: "2026-07-15"
      applicability: >-
        Hanse 460 US-market standard specification valid from 2021.11.12;
        design family only, no hull applicability. Extraction: PDF page 3,
        EQUIPMENT section, wording "battery charger: 35 A"; figures marked
        approximate by the source document.
  charge-profile:
    value: >-
      IUoUo, automatic, 3-step+ (12 V models: charge voltage bulk 14.4 V,
      absorption 14.25 V, float 13.25 V; adjustable; battery type
      settings Flooded (default), GEL, AGM, Lithium-ion (MLI), constant
      voltage)
    provenance:
      source_id: source:manufacturer:owner-held:mastervolt-chargemaster-plus-manual-10000016594-03:2026-07-16
      authority_class: sourced-manufacturer
      confidence: high
      retrieval_date: "2026-07-16"
      applicability: >-
        Vendor manual
        document:mastervolt:chargemaster-plus-manual-10000016594:03,
        chapter 7.1 "Specifications 12V models" (PDF page 28). Value
        common to both 12 V family models 12/35-3 and 12/50-3 of the
        charger family documented in the owner-held delivery set; which
        family model is installed is not confirmed as-built (issue #260),
        so no model-specific value is transcribed.
  input-voltage-range:
    value: nominal input 120/240 V, 50/60 Hz
    provenance:
      source_id: source:manufacturer:owner-held:mastervolt-chargemaster-plus-manual-10000016594-03:2026-07-16
      authority_class: sourced-manufacturer
      confidence: high
      retrieval_date: "2026-07-16"
      applicability: >-
        Vendor manual
        document:mastervolt:chargemaster-plus-manual-10000016594:03,
        chapter 7.1 "Specifications 12V models" (PDF page 28), rows
        "Nominal input voltage 120/240V" and "Nominal input frequency
        50/60Hz". Value common to family models 12/35-3 and 12/50-3;
        installed model not confirmed as-built (issue #260). The series
        circuit diagram document:hanseyachts:h20b-7215-100-010:03
        sheet 10 shows the charger fed at 230 V.
  standard-and-option-charger-ratings:
    value: >-
      35A charger standard (1xAGM); 50A charger option (2xAGM); 75A
      charger option (6xLi-Ion)
    provenance:
      source_id: source:manufacturer:owner-held:h20b-7215-100-010-03:2026-07-16
      authority_class: sourced-manufacturer
      confidence: high
      retrieval_date: "2026-07-16"
      applicability: >-
        Hanse 460 series circuit diagram
        document:hanseyachts:h20b-7215-100-010:03 (rev. 03); series
        drawing, design family only, no hull applicability; installed
        variant unconfirmed as-built (issue #260). Extraction: sheet 10,
        red note "35A charger standard (1xAGM) / 50A charger option
        (2xAGM) / 75A charger option (6xLi-Ion)" with DIP-switch tables
        "Charger 35A/50A" and "Charger 75A". Consistent with the 35 A
        standard figure of the 2021 US specification (rated-charge-current
        above) — corroboration, not a conflict.
installation_location:
