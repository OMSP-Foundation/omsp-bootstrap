name: Add to Project

# No-op until both are configured (after the OMSP Delivery project exists):
#   - repository variable PROJECT_URL, e.g. https://github.com/orgs/OMSP-Foundation/projects/1
#   - repository secret  PROJECT_PAT — fine-grained PAT with org project read/write
#     (the default GITHUB_TOKEN cannot write to organization projects)

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    if: vars.PROJECT_URL != ''
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_PAT }}
