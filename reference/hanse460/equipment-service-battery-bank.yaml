    value: AGM
    provenance:
      source_id: source:secondary:newwaveyachts:hanse-460-spec-pricelist-2021-11-12:2026-07-15
      authority_class: sourced-secondary
      confidence: medium
      retrieval_date: "2026-07-15"
      applicability: >-
        Hanse 460 US-market standard specification valid from 2021.11.12;
        design family only, no hull applicability. Extraction: PDF page 3,
        EQUIPMENT section, wording "battery set (standard): AGM, capacity
        1x 90 Ah + 1x 160 Ah" — the whole standard set is AGM.
  vessel-battery-set-composition:
    value: 1x 90 Ah + 1x 160 Ah AGM (whole-vessel standard battery set)
    provenance:
      source_id: source:secondary:newwaveyachts:hanse-460-spec-pricelist-2021-11-12:2026-07-15
      authority_class: sourced-secondary
      confidence: medium
      retrieval_date: "2026-07-15"
      applicability: >-
        Hanse 460 US-market standard specification valid from 2021.11.12;
        design family only, no hull applicability. Extraction: PDF page 3,
        EQUIPMENT section. The source does not allocate the two batteries
        between service and other functions; figures marked approximate by
        the source document.
  service-bank-capacity:
    status: unknown
    note: >-
      The captured source states the vessel battery set (1x 90 Ah +
      1x 160 Ah) without attributing capacities to the service bank;
      entering an allocation would be an unsourced inference.
  nominal-voltage:
    status: unknown
