# OMSP label taxonomy — single source of truth (synced by labels-sync.yml).
# Historical labels (sprint-0..5, bootstrap, standards, ...) are intentionally
# NOT listed: the sync runs without deletion, so they stay frozen on closed issues.

# --- type: exactly one per issue ---
- name: "type:feature"
  color: "0E8A16"
  description: "New capability or domain content"
- name: "type:bug"
  color: "D73A4A"
  description: "Something is broken or incorrect"
- name: "type:docs"
  color: "0075CA"
  description: "Documentation creation or update"
- name: "type:task"
  color: "FBCA04"
  description: "Bounded engineering or maintenance task"
- name: "type:chore"
  color: "6A737D"
  description: "Repo hygiene, cleanup, process upkeep"
- name: "type:epic"
  color: "5319E7"
  description: "Umbrella issue grouping multiple WPs toward one outcome"

# --- area: at least one per issue ---
- name: "area:ai"
  color: "C5DEF5"
  description: "AI governance and AI-assisted engineering boundaries"
- name: "area:architecture"
  color: "C5DEF5"
  description: "Platform and system architecture"
- name: "area:canon"
  color: "C5DEF5"
  description: "OMSP language and identity (canon/)"
- name: "area:ci"
  color: "C5DEF5"
  description: "CI workflows and quality gates (.github/workflows/)"
- name: "area:domain"
  color: "C5DEF5"
  description: "Maritime domain content: Hanse 460, vessel/equipment models, scenarios"
- name: "area:foundation"
  color: "C5DEF5"
  description: "Engineering standards (governance/)"
- name: "area:governance"
  color: "C5DEF5"
  description: "Governance policies and decision records (governance/)"
- name: "area:knowledge"
  color: "C5DEF5"
  description: "Knowledge engine, graph and semantic catalog"
- name: "area:ontology"
  color: "C5DEF5"
  description: "Meta-model and maritime ontology (ontology/)"
- name: "area:planning"
  color: "C5DEF5"
  description: "Sprint plans and roadmap (planning/, roadmap/)"
- name: "area:platform"
  color: "C5DEF5"
  description: "Four-engine conceptual platform (platform/)"
- name: "area:project-management"
  color: "C5DEF5"
  description: "Program/project management, process and backlog operations"
- name: "area:publication"
  color: "C5DEF5"
  description: "Publication engine and doc pipeline"
- name: "area:quality"
  color: "C5DEF5"
  description: "Quality gates, audits and repo health"
- name: "area:reference"
  color: "C5DEF5"
  description: "Reference examples and demonstrators (reference/, examples/)"
- name: "area:release"
  color: "C5DEF5"
  description: "Release and baseline preparation (GitHub Releases/milestones)"
- name: "area:risk"
  color: "C5DEF5"
  description: "Risk management (RR-XXX residual risks)"
- name: "area:schemas"
  color: "C5DEF5"
  description: "Machine-readable schemas (schemas/)"
- name: "area:templates"
  color: "C5DEF5"
  description: "Artifact templates (templates/)"
- name: "area:tooling"
  color: "C5DEF5"
  description: "Validators and generators (tooling/)"
- name: "area:traceability"
  color: "C5DEF5"
  description: "Traceability engine and WP/issue/PR linkage"
- name: "area:validation"
  color: "C5DEF5"
  description: "Validation framework and checklists (validation/, tests/)"

# --- priority ---
- name: "priority:P0"
  color: "B60205"
  description: "Critical — blocks baseline/release, do first"
- name: "priority:P1"
  color: "D93F0B"
  description: "High — current sprint scope"
- name: "priority:P2"
  color: "E99695"
  description: "Medium — next sprint candidate"
- name: "priority:P3"
  color: "F9D0C4"
  description: "Low — backlog, no schedule commitment"

# --- process ---
- name: "needs-triage"
  color: "FEF2C0"
  description: "Automation flagged: missing type/area label, milestone or title convention"

# --- merge gates (test-gated auto-merge, see ENGINEERING_PLAYBOOK §5.9 / #212) ---
- name: "gate:tester-approved"
  color: "0E8A16"
  description: "omsp-tester verdict: test checklist passed with evidence"
- name: "gate:cto-approved"
  color: "1D76DB"
  description: "omsp-cto final gate: TDD compliance verified — triggers auto-merge"
- name: "gate:test-failed"
  color: "D73A4A"
  description: "omsp-tester verdict: test failed — see test report comment"

# --- GitHub meta (kept, restyled defaults) ---
- name: "question"
  color: "D876E3"
  description: "Further information is requested"
- name: "duplicate"
  color: "CFD3D7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "E4E669"
  description: "This doesn't seem right"
- name: "wontfix"
  color: "FFFFFF"
  description: "This will not be worked on"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "good first issue"
  color: "7057FF"
  description: "Good for newcomers"
